# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Deploy staging

# Deploys any branch to the staging site, by hand: Actions → "Deploy staging"
# → Run workflow, or `gh workflow run deploy-staging.yml -f ref=<branch>`.
# This file must stay on main (GitHub only lists workflow_dispatch workflows
# from the default branch); it builds the chosen branch with that branch's
# own Dockerfile. See README "Staging".
#
# Staging runs against the e2e Supabase project, never prod: the branch's
# migrations are pushed there first, as PR runs do, and its data is
# throwaway (the e2e suite resets it).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to deploy
        required: true
        default: main

# One staging deploy at a time; a newer one waits rather than cancelling a
# half-pushed image.
concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - name: Check staging is configured
        run: |
          missing=()
          [ -z "$STAGING_URL" ] && missing+=("STAGING_URL (variable)")
          [ -z "$COOLIFY_STAGING_WEBHOOK_URL" ] && missing+=("COOLIFY_STAGING_WEBHOOK_URL (secret)")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing: ${missing[*]}. See README \"Staging\"."
            exit 1
          fi
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
          COOLIFY_STAGING_WEBHOOK_URL: ${{ secrets.COOLIFY_STAGING_WEBHOOK_URL }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve commit
        run: |
          echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "COMMIT_DATE=$(git log -1 --format=%cI)" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Push the branch's migrations to the e2e project
        # Same connection as ci.yml's e2e job; see its comments for the
        # session pooler and the URL-derived project ref.
        run: |
          project_ref=$(node -e 'process.stdout.write(new URL(process.env.SUPABASE_URL).hostname.split(".")[0])')
          encoded_password=$(node -e 'process.stdout.write(encodeURIComponent(process.env.SUPABASE_DB_PASSWORD))')
          pnpm exec supabase db push --db-url "postgresql://postgres.${project_ref}:${encoded_password}@${SUPABASE_POOLER_HOST}:5432/postgres"
        env:
          SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.E2E_SUPABASE_DB_PASSWORD }}
          SUPABASE_POOLER_HOST: ${{ vars.E2E_SUPABASE_POOLER_HOST || 'aws-1-eu-west-1.pooler.supabase.com' }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:staging
          # Its own cache scope, so staging builds don't evict main's.
          cache-from: type=gha,scope=staging
          cache-to: type=gha,mode=max,scope=staging
          # No VITE_SENTRY_DSN: staging errors would land in prod's Sentry
          # project with nothing to tell them apart.
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.E2E_SUPABASE_URL }}
            VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY=${{ secrets.E2E_SUPABASE_ANON_KEY }}
            VITE_GIT_HASH=${{ env.SHA }}
            VITE_GIT_DATE=${{ env.COMMIT_DATE }}
            VITE_BRANCH=${{ inputs.ref }}

      - name: Trigger Coolify deploy
        run: |
          curl -X POST "${{ secrets.COOLIFY_STAGING_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            -w "\nHTTP Status: %{http_code}\n" \
            -f

      - name: Wait for the new build
        run: |
          for i in $(seq 1 30); do
            deployed=$(curl -fsS "$STAGING_URL/version" | jq -r .hash) || deployed=""
            [ "$deployed" = "$SHA" ] && break
            sleep 5
          done
          [ "$deployed" = "$SHA" ] || { echo "::error::staging is on ${deployed:-nothing}, expected $SHA"; exit 1; }
          echo "Deployed \`$REF\` ($SHA) to $STAGING_URL" >> "$GITHUB_STEP_SUMMARY"
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
          REF: ${{ inputs.ref }}
